# Dedicated happy-path fixture for Suite `stg-matching`
# (plan 2026-09-17-baseline-stg-matching Task 3). Structure and field enums
# follow the backend checkout's
# apps/recruitment/testdata/stg-ephemeral/case.schema.json (scene
# `ephemeral-baseline`, schema_version 1); the schema is NOT copied into this
# repo — always `validate` through the backend CLI from the backend checkout
# root (direct calls lack the host jsonschema; wrap with
# `tools/dev-env.sh exec --`).
#
# Catalog display names (清华大学 / 计算机科学与技术 / 测试工程师 / 北京市 /
# 开发者工具) resolve against the LIVE catalogs at run time: run
# the online `validate` first — a missing or ambiguous dictionary entry is an
# honest BLOCKED, never substituted.
#
# Both roles complete onboarding and set their role preference. The two
# organization refs are shape-only placeholders: the run substitutes its own
# directory organization id on both sides before the create. The experience
# carries no employer name for the same reason, and the resume PDF
# (docs/dogfood/fixtures/stg-matching-resume.pdf) omits the employer column
# instead of inventing one that could contradict the run organization.
#
# All amounts / year-months / skills are identical across summary,
# experience, job description, job requirements and the resume PDF.
# Synthetic data only: no phone, email, or real identification. This fixture
# states facts; it never instructs any model that it "must match".
#
# Two 2026-09-17 controller rulings, applied after live-validate evidence:
# - industry: the plan's frozen "软件与信息技术服务业" came from the schema
#   example and is absent from the LIVE catalog (a custom six-root tree); the
#   controller re-froze the experience industry to the live selectable leaf
#   "开发者工具" (企业服务 / SaaS > 开发者工具, tax_sclwtqpzwuv2qmiyz2dcjjr74q).
# - projects: the deployed validator rejects experience-embedded projects
#   (must_be_omitted) even though case.schema.json defines the key, so the
#   project's facts travel as description text below; see docs/dogfood/
#   stg-matching.md §2/§11 for the recorded backend inconsistency.
